<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dziennik">
<meta name="theme-color" content="#F1F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131918" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Dziennik trawienny</title>
<style>
/* Layout: one calm column for a phone, bottom tab bar, bottom sheets for quick entry. */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --ink:#1E2927; --muted:#5E6D69; --line:#DCE3DF;
  --accent:#2D6A62; --accent-soft:#DDEBE7; --on-accent:#FFFFFF;
  --ok:#3D7A4C; --warn:#A96B12; --crit:#B2463A; --warn-soft:#F6EBD6; --crit-soft:#F6E0DC; --ok-soft:#E0EEE2;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Rounded",system-ui,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131918; --surface:#1C2422; --ink:#E5ECE9; --muted:#9BA9A5; --line:#2D3936;
    --accent:#7CC4B8; --accent-soft:#213632; --on-accent:#0F1F1C;
    --ok:#86C494; --warn:#E2B263; --crit:#E78E80; --warn-soft:#3A3020; --crit-soft:#3D2622; --ok-soft:#21342A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131918; --surface:#1C2422; --ink:#E5ECE9; --muted:#9BA9A5; --line:#2D3936;
  --accent:#7CC4B8; --accent-soft:#213632; --on-accent:#0F1F1C;
  --ok:#86C494; --warn:#E2B263; --crit:#E78E80; --warn-soft:#3A3020; --crit-soft:#3D2622; --ok-soft:#21342A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:18px} h3{font-size:16px}
p{margin:0}
small,.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
#app{max-width:540px;margin:0 auto;height:100%;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(18px,calc(env(safe-area-inset-top) + 8px)) max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{padding:10px 4px 12px;text-align:center;text-decoration:none;color:var(--muted);font-weight:500;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav a[aria-current="page"]{color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
.btn.small{min-height:36px;padding:7px 11px;font-size:14px}
.btn:disabled{opacity:.45}
.btn.block{width:100%}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big2 .btn{min-height:64px;font-size:17px;font-family:var(--display)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:500;min-height:38px;white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.banner.info{background:var(--accent-soft)}
.banner.warn{background:var(--warn-soft)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:18px}
.daynav button:disabled{opacity:.35}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tl li{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;cursor:pointer}
.tl li.sym{border-left:4px solid var(--warn)}
.tl li.sym.s-hi{border-left-color:var(--crit)}
.tl li.sym.s-lo{border-left-color:var(--line)}
.tl time{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.tl .t1{font-weight:600}
.tl .t2{font-size:14px;color:var(--muted)}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--bg);color:var(--muted);white-space:nowrap}
.sev{font-family:var(--display);font-weight:700;font-size:15px;border-radius:8px;padding:2px 9px;background:var(--warn-soft);color:var(--warn)}
.sev.hi{background:var(--crit-soft);color:var(--crit)} .sev.lo{background:var(--bg);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:15px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,18,16,.45)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
#sheet .panel.dialog{bottom:auto;top:28%;border-radius:18px;margin:0 16px;max-width:508px}
@media(min-width:572px){#sheet .panel.dialog{margin:0 auto}}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:none}
input[type=text],input[type=search],input[type=time],input[type=number],select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:44px;width:100%}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 9px;font-size:13px;font-weight:500;min-height:36px}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg.wide{display:grid;width:100%}
.seg.wide button{min-height:44px;font-size:14px}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.item .x{border:0;background:transparent;width:34px;height:34px;font-size:18px;color:var(--muted)}
.results{display:flex;flex-wrap:wrap;gap:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles button{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:50px;font-weight:600;padding:8px}
.tiles button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sevrow{display:flex;align-items:center;gap:14px}
.sevrow output{font:700 34px/1 var(--display);min-width:48px;text-align:center}
input[type=range]{flex:1;accent-color:var(--accent);height:36px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;min-height:40px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.stepper b{font:700 20px var(--display);min-width:70px;text-align:center}
/* report */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:700 22px var(--display)}
.stat span{font-size:12px;color:var(--muted)}
.pill{font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.pill i{font-style:normal;letter-spacing:2px;font-size:10px}
.pill.high{background:var(--crit-soft);color:var(--crit)}
.pill.med{background:var(--warn-soft);color:var(--warn)}
.pill.low{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.cmp{display:grid;grid-template-columns:1fr;gap:3px;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.cmp.ctrl .bar span{background:var(--muted);opacity:.55}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
details.card summary{cursor:pointer;font-weight:600;font-family:var(--display);list-style:none;display:flex;justify-content:space-between;gap:8px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";color:var(--muted);font-weight:400}
details.card[open] summary::after{content:"–"}
details.card>div{margin-top:10px}
.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:14px}
.plain li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:7px}
.plain li:last-child{border:0;padding-bottom:0}
.prose{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.prose b{color:var(--ink)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:508px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:30;font-size:15px}
#toast.show{display:flex}
#toast button{background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px}
textarea.say{min-height:64px;font:400 17px/1.4 var(--body);padding:12px;resize:none}
.unk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
@media (prefers-reduced-motion:no-preference){#sheet.open .panel:not(.dialog){animation:up .18s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
</style>
</head>

  const bf=[['Owsianka',['płatki owsiane','napój owsiany','banan dojrzały']],['Owsianka',['płatki owsiane','napój owsiany','banan dojrzały']],['Jaglanka z malinami',['kasza jaglana','napój migdałowy','maliny']],['Kanapki z szynką',['chleb żytni','szynka','pomidor','sałata']],['Tost z awokado',['chleb na zakwasie','awokado','pomidor']]];
  const sn=[['jabłko'],['jabłko'],['jabłko'],['banan dojrzały'],['orzechy włoskie'],['czekolada gorzka','herbata czarna'],['wafle ryżowe','hummus'],['mandarynka'],['jogurt kokosowy','borówki'],['kawa bezkofeinowa'],['herbata czarna'],['wafle ryżowe','masło orzechowe'],['kiwi']];
  const lh=[['Kurczak z ryżem',['pierś z kurczaka','ryż biały','marchew','oliwa z oliwek']],['Makaron z warzywami',['makaron pszenny','cukinia','cebula','czosnek','oliwa z oliwek']],['Zupa z soczewicy',['soczewica','marchew','cebula','pomidor']],['Sałatka z ciecierzycą',['ciecierzyca','rukola','pomidor','ogórek','oliwa z oliwek']],['Łosoś z ziemniakami',['łosoś','ziemniaki','koper','sałata']]];
  const lo=[['burger','frytki'],['sushi'],['kebab'],['pho'],['falafel wrap'],['curry z ryżem'],['poke bowl'],['sałatka z kurczakiem'],['makaron z sosem pomidorowym']];
  const dn=[['Kasza z pieczarkami',['kasza gryczana','pieczarki','cebula','oliwa z oliwek']],['Kanapki z szynką',['chleb żytni','szynka','pomidor','sałata']],['Zupa pomidorowa',['zupa pomidorowa','ryż biały']],['Ryż z warzywami',['ryż biały','cukinia','papryka czerwona','marchew','oliwa z oliwek']],['Dorsz z ziemniakami',['dorsz','ziemniaki','marchew']],['Kurczak z ryżem',['pierś z kurczaka','ryż biały','marchew','oliwa z oliwek']]];
  const today0=startOfDay(Date.now()),N=42;
  const addSym=(t,type,sev)=>{if(t<Date.now())st.symptoms.push({id:uid(),t:Math.round(t),type,sev})};
  for(let i=N;i>=0;i--){
    const d0=today0-i*DAY,di=N-i;
    const stress=pick([1,2,2,2,3,3,3,4,4,5]),period=(di>=8&&di<=12)||(di>=36&&di<=40);
    if(i>0)st.days[dayKey(d0)]={sleep:Math.round((5+rnd()*3.5)*2)/2,stress,activity:pick([0,0,1,1,2,2,3]),period};
    const plan=[[8,pick(bf)],[11,['',pick(sn)]],[14,rnd()<.6?['',pick(lo),1]:pick(lh)],[17,['',pick(sn)]],[20,rnd()<.22?['',pick(lo),1]:pick(dn)]];
    if(di%13===6)plan[3]=[17,['',['pistacje']]];
    if(di%11===4)plan[3]=[17,['',['chleb żytni','ser żółty']]];
    if(new Date(d0).getDay()===6&&rnd()<.6)plan.push([21.5,['',[pick(['wino czerwone','piwo'])],1]]);
    for(const [h,[name,items,out]] of plan){
      const t=d0+(h+(rnd()-.5)*.9)*H; if(t>Date.now())continue;
      st.meals.push({id:uid(),t:Math.round(t),name,items:items.map(n=>({f:'b:'+n,a:pick([1,2,2,2,3])})),out:!!out});
      const mult=stress>=4?1.25:1;
      for(const n of items){
        const tg=tagsOf(n);let p=0,type='wzdecia',lag=1+rnd()*3.5;
        if(n==='cebula'||n==='czosnek')p=.5;
        else if(n==='jabłko'){p=.45}
        else if(n==='pistacje'){p=.97;type='gazy'}
        else if(tg.includes('R')){p=.42;type=pick(['gazy','wzdecia']);lag=2+rnd()*3.5}
        else if(tg.includes('F'))p=.2;
        if(rnd()<p*mult)addSym(t+lag*H,type,3+Math.floor(rnd()*5));
        if(tg.includes('S')&&rnd()<.3)addSym(t+(.7+rnd()*2)*H,pick(['pelnosc','nudnosci']),3+Math.floor(rnd()*4));
      }
    }
    if(rnd()<.1)addSym(d0+(9+rnd()*12)*H,pick(['bol','odbijanie','pelnosc']),2+Math.floor(rnd()*4));
    if(stress>=4&&rnd()<.3)addSym(d0+(12+rnd()*8)*H,'bol',4+Math.floor(rnd()*3));
    if(period&&rnd()<.35)addSym(d0+(8+rnd()*10)*H,'bol',4+Math.floor(rnd()*4));
  }
  st.symptoms.sort((x,y)=>x.t-y.t);
  st.symptoms=st.symptoms.filter((s,i,arr)=>!(i>0&&arr[i-1].type===s.type&&s.t-arr[i-1].t<2*H));
  const fav=(n,it)=>({id:uid(),name:n,items:it.map(x=>({f:'b:'+x,a:2}))});
  st.favorites=[fav('Owsianka',bf[0][1]),fav('Kanapki z szynką',bf[3][1]),fav('Herbata czarna',['herbata czarna']),fav('Kurczak z ryżem',lh[0][1])];
  return st;
}

/* ---------- analiza ---------- */
const WINS=[{k:'A',from:.5,to:6,label:'30 min–6 h'},{k:'B',from:6,to:24,label:'6–24 h'},{k:'C',from:24,to:72,label:'24–72 h'}];
const RANK={high:3,med:2,low:1,none:0,few:-1};
const lfc=[0,0];function lf(n){for(let i=lfc.length;i<=n;i++)lfc[i]=lfc[i-1]+Math.log(i);return lfc[n]}
const lc=(n,k)=>lf(n)-lf(k)-lf(n-k);
function fisher(a,b,c,d){const n1=a+b,n0=c+d,k=a+c,N=n1+n0;let p=0;for(let x=a;x<=Math.min(n1,k);x++){if(k-x>n0)continue;p+=Math.exp(lc(n1,x)+lc(n0,k-x)-lc(N,k))}return Math.min(1,p)}
function grade(a,b,c,d,late){
  const n1=a+b,n0=c+d;const r={a,b,c,d,n1,n0,p1:n1?a/n1:0,p0:n0?c/n0:0};
  r.diff=r.p1-r.p0;
  if(n1<5||n0<5){r.conf='few';return r}
  r.p=fisher(Math.round(a),Math.round(b),Math.round(c),Math.round(d));
  /* okna 6–24 h i 24–72 h nakładają się na wiele posiłków, więc wymagają mocniejszego sygnału */
  r.conf=late?((n1>=20&&r.diff>=.25&&r.p<.001)?'high':(n1>=10&&r.diff>=.2&&r.p<.01)?'med':(r.diff>=.2&&r.p<.05)?'low':'none')
    :((n1>=20&&r.diff>=.2&&r.p<.01)?'high':(n1>=10&&r.diff>=.15&&r.p<.05)?'med':(r.diff>=.15&&r.p<.1)?'low':'none');
  return r;
}
let anCache=null,anRev=-1;
function analysis(){if(anRev!==rev){anCache=analyze(S);anRev=rev}return anCache}
function analyze(st){
  const now=Date.now(),min=st.settings.sevMin||4;
  const syms=st.symptoms.filter(s=>s.sev>=min).sort((a,b)=>a.t-b.t);
  const meals=[...st.meals].sort((a,b)=>a.t-b.t);
  const inWin=(t0,t1)=>syms.filter(s=>s.t>=t0&&s.t<=t1);
  const sets=meals.map(m=>{const p=new Set(),g=new Set();m.items.forEach(i=>{p.add(i.f);food(i.f).tags.forEach(x=>g.add(x))});return {p,g}});
  const byDay={};meals.forEach((m,i)=>{(byDay[dayKey(m.t)]=byDay[dayKey(m.t)]||[]).push(i)});
  function evalEnt(has){
    const expT=[];meals.forEach((m,i)=>{if(has(i))expT.push(m.t)});
    const near=(t0,t1)=>expT.some(t=>t>=t0&&t<=t1);
    const wins=WINS.map(w=>{
      let a=0,b=0,c=0,d=0;const types={};
      const add=(t,wt,exp)=>{
        if(t+w.to*H>now)return;
        const ss=inWin(t+w.from*H,t+w.to*H);
        if(exp){if(ss.length){a+=wt;new Set(ss.map(s=>s.type)).forEach(ty=>types[ty]=(types[ty]||0)+1)}else b+=wt}
        else{if(ss.length)c+=wt;else d+=wt}
      };
      if(w.k==='A')meals.forEach((m,i)=>{const wt=m.out?.5:1;if(has(i))add(m.t,wt,true);else if(!near(m.t-w.to*H,m.t+w.to*H))add(m.t,wt,false)});
      else for(const k in byDay){const idx=byDay[k],e=idx.find(has);if(e!==undefined)add(meals[e].t,meals[e].out?.5:1,true);else{const t=meals[idx[0]].t;if(!near(t-w.to*H,t+w.to*H))add(t,1,false)}}
      const g=grade(a,b,c,d,w.k!=='A');g.w=w;g.types=types;return g;
    });
    let best=wins[0];for(const g of wins)if(RANK[g.conf]>RANK[best.conf]||(RANK[g.conf]===RANK[best.conf]&&RANK[g.conf]>0&&g.diff>best.diff))best=g;
    let status=best.conf;
    if(status==='few'){status=wins.some(g=>g.n1>=5)?'nocontrol':'few'}
    if(status==='none'){best=wins.find(g=>g.conf==='none')}
    const top=Object.entries(best.types).sort((x,y)=>y[1]-x[1])[0];
    return {n:expT.length,last:expT.length?expT[expT.length-1]:0,wins,best,status,top:top?top[0]:null};
  }
  const ents=[];
  for(const g in GROUPS){const r=evalEnt(i=>sets[i].g.has(g));ents.push({type:'g',key:g,name:GROUPS[g],...r})}
  const seen=new Set();sets.forEach(s=>s.p.forEach(p=>seen.add(p)));
  seen.forEach(p=>{const r=evalEnt(i=>sets[i].p.has(p));ents.push({type:'p',key:p,name:cap(food(p).name),tags:food(p).tags,...r})});
  const ord=(x,y)=>RANK[y.best.conf]-RANK[x.best.conf]||y.best.diff-x.best.diff;
  const suspects=ents.filter(e=>RANK[e.status]>0).sort(ord);
  const susP=suspects.filter(e=>e.type==='p');
  susP.forEach(e=>{const mine=sets.filter(s=>s.p.has(e.key));e.withOthers=susP.filter(o=>o!==e&&mine.filter(s=>s.p.has(o.key)).length/mine.length>=.5).map(o=>o.name)});
  const clear=ents.filter(e=>e.status==='none').sort((x,y)=>y.n-x.n);
  const few=ents.filter(e=>e.status==='few'&&e.n>0).sort((x,y)=>y.n-x.n);
  const nocontrol=ents.filter(e=>e.status==='nocontrol').sort((x,y)=>y.n-x.n);
  const absent=ents.filter(e=>e.type==='g'&&(e.n===0||now-e.last>21*DAY&&e.n<5));
  const dayKeys=Object.keys(byDay).sort();
  const symDays=new Set(syms.map(s=>dayKey(s.t)));
  const meta={days:dayKeys.length,from:dayKeys.length?keyToDate(dayKeys[0]).getTime():now,to:dayKeys.length?keyToDate(dayKeys[dayKeys.length-1]).getTime():now,meals:meals.length,symptoms:st.symptoms.length,counted:syms.length,symDays:[...symDays].filter(k=>byDay[k]).length,min,outShare:meals.length?meals.filter(m=>m.out).length/meals.length:0};
  meta.enough=meta.days>=14&&meta.counted>=10;
  const bySym=Object.keys(SYM).map(k=>{const l=st.symptoms.filter(s=>s.type===k);return {k,name:SYM[k],n:l.length,avg:l.length?l.reduce((s,x)=>s+x.sev,0)/l.length:0}}).filter(x=>x.n).sort((x,y)=>y.n-x.n);
  const fdefs=[['Krótki sen (poniżej 6 h)',d=>d.sleep!=null?d.sleep<6:null],['Wysoki stres (4–5)',d=>d.stress!=null?d.stress>=4:null],['Miesiączka',d=>d.period!=null?!!d.period:null],['Aktywność umiarkowana lub intensywna',d=>d.activity!=null?d.activity>=2:null]];
  const factors=fdefs.map(([name,fn])=>{let a=0,b=0,c=0,d=0;for(const k in st.days){const v=fn(st.days[k]);if(v===null)continue;const s=symDays.has(k);if(v){s?a++:b++}else{s?c++:d++}}return {name,...grade(a,b,c,d)}});
  return {ents,suspects,clear,few,nocontrol,absent,meta,bySym,factors};
}
const CONF={high:['wysoka','●●●'],med:['średnia','●●○'],low:['niska','●○○']};

/* ---------- testy ---------- */
function entHas(ent,m){return m.items.some(i=>ent.type==='p'?i.f===ent.key:food(i.f).tags.includes(ent.key))}
function burden(t0,t1){const min=S.settings.sevMin||4;const days=Math.round((t1-t0)/DAY);const ss=S.symptoms.filter(s=>s.t>=t0&&s.t<t1&&s.sev>=min);const sd=new Set(ss.map(s=>dayKey(s.t)));return {days,symDays:sd.size,avg:days?ss.reduce((a,s)=>a+s.sev,0)/days:0}}
function testInfo(t){
  const now=Date.now(),end=t.start+t.len*DAY,dayNo=Math.min(t.len,Math.floor((now-t.start)/DAY)+1),done=now>=end||!!t.stopped;
  const stopAt=t.stopped||Math.min(now,end);
  const viol=t.kind==='elim'?S.meals.filter(m=>m.t>=t.start&&m.t<stopAt&&entHas(t.ent,m)).length:0;
  const during=burden(t.start,startOfDay(stopAt)+(done&&!t.stopped?0:DAY)),before=burden(t.start-t.len*DAY,t.start);
  return {end,dayNo,done,viol,during,before};
}
function suggestions(an){
  const out=[];const active=S.tests.find(t=>!testInfo(t).done);
  const strong=an.suspects.filter(e=>e.status!=='low'),weak=an.suspects.filter(e=>e.status==='low');
  const prods=strong.filter(e=>e.type==='p'),grps=strong.filter(e=>e.type==='g');
  const why=e=>`Objawy po: ${pct(e.best.p1)} (${fmtN(e.best.a)} z ${fmtN(e.best.n1)}), bez: ${pct(e.best.p0)}. Pewność ${CONF[e.status][0]}.`;
  [...prods.slice(0,3),...grps.slice(0,2)].forEach(e=>out.push({kind:'elim',ent:{type:e.type,key:e.key},label:e.name,len:14,why:why(e),note:e.type==='g'?'To cała grupa produktów. Szeroką eliminację najlepiej prowadzić z dietetykiem.':''}));
  if(!out.length)weak.slice(0,2).forEach(e=>out.push({kind:'elim',ent:{type:e.type,key:e.key},label:e.name,len:14,why:why(e),note:'Sygnał jest słaby. Możesz poczekać na więcej danych albo sprawdzić go testem.'}));
  (S.settings.excluded||[]).forEach(g=>{const e=an.ents.find(x=>x.type==='g'&&x.key===g);if(e&&(e.n<5))out.push({kind:'reintro',ent:{type:'g',key:g},label:GROUPS[g],len:6,why:'Wykluczasz tę grupę, więc dziennik nie ma danych do porównania.',note:'Ponowne wprowadzenie pokaże, czy wykluczenie jest potrzebne. Zacznij od małej porcji; najlepiej po rozmowie z lekarzem lub dietetykiem.'})});
  return {out,active};
}

function susCard(e){

  return `<article class="card stack"><div class="row between"><h3>${esc(e.name)}</h3><span class="pill ${e.status}"><i>${c[1]}</i>${c[0]}</span></div><small>${kind}</small>
  <div class="cmp"><div><b class="num">${pct(b.p1)}</b> przypadków z objawem po zjedzeniu <small class="num">(${fmtN(b.a)} z ${fmtN(b.n1)})</small></div><div class="bar"><span style="width:${Math.round(b.p1*100)}%"></span></div></div>

  <small>Okno: ${b.w.label} po jedzeniu${e.top?' · najczęściej: '+SYM[e.top].toLowerCase():''}</small>${e.withOthers&&e.withOthers.length?`<small>Zwykle jedzone razem z: ${esc(e.withOthers.join(', ').toLowerCase())}. Dziennik nie rozróżni, które z nich szkodzi.</small>`:''}</article>`;
}
function vReport(){
  const an=analysis(),m=an.meta;
  let h=`<div class="row between"><h1>Raport</h1><button class="btn small" data-act="pdf">Eksport do PDF</button></div>`;
  if(S.sample)h+=`<div class="banner info"><span>Raport liczony z <b>danych przykładowych</b>.</span></div>`;
  h+=`<div class="stats"><div class="stat"><b class="num">${m.days}</b><span>dni z wpisami</span></div><div class="stat"><b class="num">${m.meals}</b><span>posiłków</span></div><div class="stat"><b class="num">${m.symptoms}</b><span>objawów</span></div></div>`;
  if(!m.enough)h+=`<div class="banner warn"><b>Za mało danych na wnioski</b><span>Masz ${m.days} dni z wpisami i ${m.counted} objawów o nasileniu ${m.min}+. Pierwsze sensowne sygnały pojawiają się zwykle po 2–3 tygodniach regularnych wpisów (co najmniej 14 dni i 10 objawów). Poniższe wyniki traktuj jako wstępne.</span></div>`;
  h+=`<div class="sec-h"><h2>Podejrzane</h2><small>${an.suspects.length?an.suspects.length+' pozycji':''}</small></div>`;
  if(!an.suspects.length)h+=`<div class="card empty">Na razie żaden produkt ani grupa nie wyróżnia się na tle pozostałych.</div>`;
  else h+=an.suspects.map(susCard).join('');
  const li=(e,r)=>`<li><span>${esc(e.name)}${e.type==='g'?' <span class="tag">grupa</span>':''}</span><span class="muted num">${r}</span></li>`;
  if(an.few.length)h+=`<details class="card"><summary>Za mało danych (${an.few.length})</summary><div class="stack"><small>Mniej niż 5 pełnych obserwacji (posiłek na mieście liczy się jako pół). Nie da się jeszcze nic powiedzieć, nawet jeśli po każdej był objaw.</small><ul class="plain">${an.few.map(e=>li(e,`${e.n}× · objaw po ${fmtN(e.wins[0].a)}`)).join('')}</ul></div></details>`;
  if(an.nocontrol.length)h+=`<details class="card"><summary>Jedzone zbyt często, żeby porównać (${an.nocontrol.length})</summary><div class="stack"><small>Brakuje okresów bez tego produktu. Ocenić go może tylko test eliminacji.</small><ul class="plain">${an.nocontrol.map(e=>li(e,`${e.n}×`)).join('')}</ul></div></details>`;
  if(an.clear.length)h+=`<details class="card"><summary>Bez wyraźnego związku (${an.clear.length})</summary><div class="stack"><small>Wystarczająco dużo obserwacji i brak różnicy. To nie dowód, że produkt jest bezpieczny, ale na razie nic na niego nie wskazuje.</small><ul class="plain">${an.clear.map(e=>li(e,`${pct(e.best.p1)} vs ${pct(e.best.p0)} · ${e.n}×`)).join('')}</ul></div></details>`;
  if(an.absent.length)h+=`<details class="card"><summary>Grupy bez danych (${an.absent.length})</summary><div class="stack"><small>Nie jesz ich albo jesz bardzo rzadko, więc dziennik nie może ich ocenić.</small><ul class="plain">${an.absent.map(e=>li(e,(S.settings.excluded||[]).includes(e.key)?'wykluczone':e.n+'×')).join('')}</ul></div></details>`;
  h+=`<div class="sec-h"><h2>Czynniki dodatkowe</h2></div><div class="card"><ul class="plain">${an.factors.map(f=>`<li><span>${f.name}<br><small>${f.conf==='few'?`za mało dni do porównania (${f.n1} i ${f.n0})`:`dni z objawami: <b class="num">${pct(f.p1)}</b> (${f.a} z ${f.n1}) vs ${pct(f.p0)} (${f.c} z ${f.n0})`}</small></span>${CONF[f.conf]?`<span class="pill ${f.conf}"><i>${CONF[f.conf][1]}</i>${CONF[f.conf][0]}</span>`:'<span class="muted">'+(f.conf==='few'?'':'bez związku')+'</span>'}</li>`).join('')}</ul></div>`;
  if(an.bySym.length)h+=`<div class="sec-h"><h2>Objawy</h2></div><div class="card"><ul class="plain">${an.bySym.map(s=>`<li><span>${s.name}</span><span class="muted num">${s.n}× · średnio ${s.avg.toFixed(1).replace('.',',')}</span></li>`).join('')}</ul></div>`;
  h+=`<details class="card"><summary>Jak czytać ten raport</summary><div class="prose">
  <p><b>Co porównuję.</b> Dla każdego produktu i grupy liczę, jak często po zjedzeniu pojawiał się objaw o nasileniu ${m.min}+, i zestawiam to z okresami, w których tego produktu nie było.</p>
  <p><b>Okna czasowe.</b> Sprawdzam trzy okna: 30 min–6 h, 6–24 h i 24–72 h. Pokazuję to, w którym różnica jest najwyraźniejsza. Dwa pierwsze są najbardziej wiarygodne.</p>
  <p><b>Pewność.</b> Niska: co najmniej 5 obserwacji i różnica 15+ punktów, ale wynik mógł jeszcze wyjść przypadkiem. Średnia: 10+ obserwacji i różnica co najmniej 15 punktów procentowych. Wysoka: 20+ obserwacji, różnica co najmniej 20 punktów i wynik mało prawdopodobny jako przypadek (dokładny test Fishera, p&nbsp;&lt;&nbsp;0,01). Dla okien powyżej 6 h progi są ostrzejsze.</p>
  <p><b>Posiłki na mieście</b> liczą się jako pół obserwacji, bo ich skład jest niepewny.</p>
  <p><b>Ograniczenia.</b> To są współwystąpienia, nie dowód przyczyny. Produkty jedzone razem (np. cebula i czosnek) trudno rozdzielić. Przy wielu sprawdzanych produktach część wyników pojawia się przypadkiem. Przypisanie produktów do grup (zwłaszcza FODMAP) jest przybliżone. Podejrzenie potwierdza dopiero test eliminacji i ponownego wprowadzenia.</p></div></details>`;
  return h;
}
function vTests(){
  const an=analysis(),{out,active}=suggestions(an);
  let h=`<h1>Testy</h1><p class="muted" style="font-size:14px">Raport pokazuje podejrzenia. Test je sprawdza: przez określony czas nie jesz jednego produktu i patrzysz, czy objawy słabną. Prowadź jeden test naraz.</p>`;
  if(active){const i=testInfo(active);
    h+=`<div class="card stack"><div class="row between"><h3>${active.kind==='elim'?'Eliminacja':'Ponowne wprowadzenie'}: ${esc(active.label)}</h3><span class="pill ok">dzień ${i.dayNo} z ${active.len}</span></div><div class="bar"><span style="width:${Math.round(i.dayNo/active.len*100)}%"></span></div>
    <small>${active.kind==='elim'?`Do ${dShort(i.end-DAY)} nie jedz tego produktu. Wpisuj posiłki i objawy jak zwykle.`:'Przez pierwsze 3 dni jedz małą porcję raz dziennie, potem 3 dni obserwuj bez niej.'}</small>
    ${i.viol?`<small style="color:var(--crit)">W czasie testu produkt pojawił się w dzienniku ${i.viol}×. Wynik będzie mniej wiarygodny.</small>`:''}
    <div><button class="btn small danger" data-act="stopTest" data-id="${active.id}">Zakończ test teraz</button></div></div>`}
  h+=`<div class="sec-h"><h2>Propozycje</h2></div>`;
  if(S.sample)h+=`<small>Propozycje wynikają z danych przykładowych.</small>`;
  if(!out.length)h+=`<div class="card empty">Brak propozycji. Zbieraj dane jeszcze przez kilka dni.</div>`;
  h+=out.map((s,i)=>`<div class="card stack"><div class="row between"><h3>${s.kind==='elim'?'Wyeliminuj':'Wprowadź ponownie'}: ${esc(s.label)}</h3><span class="tag">${s.len} dni</span></div><small>${s.why}</small>${s.note?`<small>${s.note}</small>`:''}<div><button class="btn small ${active?'':'primary'}" data-act="startTest" data-i="${i}" ${active?'disabled':''}>${active?'Trwa inny test':'Rozpocznij test'}</button></div></div>`).join('');
  h+=`<div class="sec-h"><h2>Co już wykluczasz</h2></div><div class="card stack"><small>Zaznaczone grupy raport pokaże jako „wykluczone” zamiast „brak danych”.</small><div class="chips">${Object.entries(GROUPS).map(([k,n])=>`<button class="chip ${(S.settings.excluded||[]).includes(k)?'on':''}" data-act="togExcl" data-k="${k}">${n}</button>`).join('')}</div></div>`;
  const done=S.tests.filter(t=>testInfo(t).done).reverse();
  if(done.length){h+=`<div class="sec-h"><h2>Zakończone</h2></div>`+done.map(t=>{const i=testInfo(t),dd=i.during.days?i.during.symDays/i.during.days:0,bd=i.before.days?i.before.symDays/i.before.days:0;
    const better=bd-dd>=.25,worse=dd-bd>=.25;
    const verdict=t.kind==='elim'?(better?'Wyraźnie mniej objawów. Podejrzenie się wzmacnia. Następny krok: mała porcja na próbę, żeby je potwierdzić.':worse?'Objawów było więcej. Ten produkt raczej nie jest przyczyną.':'Bez wyraźnej zmiany. Ten produkt raczej nie jest główną przyczyną.'):(worse?'Po ponownym wprowadzeniu objawów było więcej. Wykluczenie wygląda na uzasadnione.':'Bez wyraźnego pogorszenia. Możliwe, że wykluczenie nie jest potrzebne. Omów to z dietetykiem.');
    return `<div class="card stack"><h3>${t.kind==='elim'?'Eliminacja':'Ponowne wprowadzenie'}: ${esc(t.label)}</h3><small>${dShort(t.start)}–${dShort(i.end-DAY)}${t.stopped?' (przerwany)':''}</small><ul class="plain"><li><span>Dni z objawami w teście</span><span class="num">${i.during.symDays} z ${i.during.days}</span></li><li><span>W takim samym okresie przed</span><span class="num">${i.before.symDays} z ${i.before.days}</span></li></ul><small>${i.during.days<5?'Test był za krótki, żeby go ocenić.':verdict}${i.viol?` Uwaga: produkt zjedzony ${i.viol}× w trakcie.`:''}</small></div>`}).join('')}
  return h;
}

function itemsHtml(){const d=UI.d;if(!d.items.length)return `<small>Jeszcze nic. Wybierz składniki poniżej.</small>`;
  return d.items.map((i,n)=>`<div class="item"><span class="grow">${esc(cap(food(i.f).name))}</span><span class="seg">${[1,2,3].map(a=>`<button class="${i.a===a?'on':''}" data-act="amt" data-n="${n}" data-a="${a}">${AMT[a]}</button>`).join('')}</span><button class="x" data-act="rmItem" data-n="${n}" aria-label="Usuń składnik">×</button></div>`).join('')}
function frequent(){const c={};S.meals.forEach(m=>m.items.forEach(i=>c[i.f]=(c[i.f]||0)+1));let ids=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  if(ids.length<8)ids=[...ids,...['herbata czarna','kawa bezkofeinowa','czekolada gorzka','chleb żytni','ryż biały','banan dojrzały','pomidor','pierś z kurczaka','ziemniaki','jabłko'].map(n=>'b:'+n)];
  return [...new Set(ids)].slice(0,14).map(food)}

  let list;if(!nq)list=frequent();else{const all=[...S.customFoods,...BUILTIN];const st=all.filter(f=>norm(f.name).startsWith(nq)),mid=all.filter(f=>!norm(f.name).startsWith(nq)&&norm(f.name).includes(nq));list=[...st,...mid].slice(0,24)}

  if(nq&&!list.some(f=>norm(f.name)===nq))h+=`<button class="chip on" data-act="newFood" data-name="${esc(q.trim())}">+ Dodaj „${esc(q.trim())}” jako własny produkt</button>`;

const SAY_FILL=['sniadan','obiad','obiadu','kolacj','lunch','przekas','podwiecz','kromk','kawalek','kawalk','plaster','plastr','szklank','misk','misecz','porcj','lyzk','lyzecz','garsc','sztuk','godzin','minut','opakow','talerz','filizank','puszk','butelk','kieliszk','lampk','kufl','kubk','kubek','miesci','miasto','restaurac','wynos','knajp'];
const SAY_ALIAS={owsianka:'płatki owsiane',owsianke:'płatki owsiane',banan:'banan dojrzały',herbata:'herbata czarna',ryz:'ryż biały',makaron:'makaron pszenny',mleko:'mleko krowie',jajko:'jajko gotowane',jaja:'jajko gotowane',jogurt:'jogurt naturalny',ser:'ser żółty',twarog:'ser biały (twaróg)',chleb:'chleb pszenny',bulka:'bułka pszenna',kurczak:'kurczak pieczony',kartofle:'ziemniaki',papryka:'papryka czerwona',fasola:'fasola biała',kasza:'kasza gryczana',kawa:'kawa',czekolada:'czekolada gorzka',wino:'wino czerwone',orzechy:'orzechy włoskie',tost:'chleb pszenny',grzanka:'chleb pszenny',grzanki:'chleb pszenny',decaf:'kawa bezkofeinowa',kanapka:'chleb pszenny',kanapki:'chleb pszenny',pieczywo:'chleb pszenny',bezkofeinowa:'kawa bezkofeinowa',bezkofeinowej:'kawa bezkofeinowa',ziemniak:'ziemniaki',frytki:'frytki',salatka:'sałatka z kurczakiem',zupa:'zupa pomidorowa',sok:'sok pomarańczowy'};
const sayToks=s=>norm(s).replace(/\(.*?\)/g,' ').split(/[^a-z0-9]+/).filter(Boolean);
function stemEq(a,b){if(a===b)return true;if(a==='bez'||b==='bez')return false;const m=Math.min(a.length,b.length);if(m<3)return false;let L=0;while(L<m&&a[L]===b[L])L++;return m>=5?L>=Math.max(4,m-2):L>=3}
const lex=(a,b)=>{for(let i=0;i<a.length;i++)if(a[i]!==b[i])return a[i]-b[i];return 0};
const isFill=t=>SAY_STOP.has(t)||/^\d/.test(t)||t.length<2||SAY_FILL.some(p=>t.startsWith(p));
let sayIdx=null,sayRev=-1;
function sayFoods(){const key=S.customFoods.length+'|'+S.favorites.map(f=>f.id+f.name).join();if(sayRev!==key){
  sayIdx=[...S.favorites.map(f=>({fav:f,name:f.name})),...S.customFoods,...BUILTIN].map(f=>({f,toks:sayToks(f.name).filter(t=>!['z','ze','i','w','na','do','a'].includes(t))})).filter(x=>x.toks.length);sayRev=key}return sayIdx}
function parseMeal(text){
  const raw=text.trim(),n=norm(raw);const res={items:[],unknown:[],out:/\b(na miescie|w miescie|w restauracji|na wynos|w knajpie|w barze|w kawiarni|z dostawa)\b/.test(n),t:null};
  let m=n.match(/\b(\d+(?:[.,]\d+)?|pol|jedna|dwie|dwa|trzy)?\s*(godzin\w*|minut\w*)\s+temu\b/);
  if(m){const num={pol:.5,jedna:1,dwie:2,dwa:2,trzy:3}[m[1]]??(m[1]?parseFloat(m[1].replace(',','.')):1);const mins=m[2].startsWith('godzin')?(m[1]==='pol'?30:num*60):num;res.t=Date.now()-mins*60e3}
  else if((m=n.match(/\bo (\d{1,2})(?:[:.](\d{2}))?\b/))&&+m[1]<24){const d=new Date(keyToDate(UI.day).getTime());d.setHours(+m[1],+(m[2]||0),0,0);if(d.getTime()<=Date.now()+5*60e3)res.t=d.getTime()}
  const freq={};S.meals.forEach(x=>x.items.forEach(i=>freq[i.f]=(freq[i.f]||0)+1));
  const add=(id,a)=>{const ex=res.items.find(i=>i.f===id);if(ex){if(a!==2)ex.a=a}else res.items.push({f:id,a})};
  const foodsL=sayFoods(),byName=new Map(BUILTIN.map(f=>[f.name,f.id]));
  const chunks=raw.split(/[,;.+\n]|\s(?:i|oraz|a|plus|potem|do tego|a do tego|a potem)\s/i);
  for(const ch of chunks){
    const words=ch.split(/\s+/).filter(Boolean).map(w=>({o:w.replace(/[^\p{L}\p{N}-]/gu,''),t:sayToks(w)[0]||''})).filter(w=>w.t);
    const nt=words.map(w=>w.t);
    let a=2;if(nt.some(t=>['malo','mala','male','maly','malej','malym','troche','troszke','odrobina','odrobine','pol','polowa','polowe'].includes(t)))a=1;else if(nt.some(t=>['duzo','duza','duze','duzy','duzej','duzym','podwojna','podwojny'].includes(t)))a=3;
    const used=words.map(w=>isFill(w.t));
    for(;;){let best=null;
      for(const c of foodsL){if(!c.fav&&c.toks.length<2)continue;const pick=[];let exact=0,len=0;
        for(const ft of c.toks){const j=words.findIndex((w,i)=>!used[i]&&!pick.includes(i)&&stemEq(w.t,ft));if(j<0){pick.length=0;break}pick.push(j);if(words[j].t===ft)exact++;len+=ft.length}
        if(!pick.length)continue;const sc=[c.toks.length,c.fav?1:0,exact,len];
        if(!best||lex(sc,best.sc)>0)best={c,pick,sc}}
      if(!best)break;best.pick.forEach(i=>used[i]=true);
      if(best.c.fav)best.c.fav.items.forEach(i=>add(i.f,a===2?i.a:a));else add(best.c.f.id,a)}
    words.forEach((w,i)=>{if(!used[i]&&w.t==='bez'){used[i]=true;const k=words.findIndex((x,j)=>j>i&&!used[j]);if(k>=0)used[k]=true}});
    words.forEach((w,i)=>{if(used[i])return;
      let best=null;const al=Object.keys(SAY_ALIAS).find(k=>stemEq(w.t,k)),alId=al&&byName.get(SAY_ALIAS[al]);
      for(const c of foodsL){if(c.fav||!stemEq(w.t,c.toks[0]))continue;const id=c.f.id;
        const sc=[freq[id]||0,(c.toks.length===1&&w.t===c.toks[0])?1:0,id===alId?1:0,w.t===c.toks[0]?1:0,-c.toks.length,-c.f.name.length];
        if(!best||lex(sc,best.sc)>0)best={id,sc}}
      if(alId){const sc=[freq[alId]||0,0,1,0,0,0];if(!best||lex(sc,best.sc)>0)best={id:alId,sc}}
      used[i]=true;if(best)add(best.id,a);else res.unknown.push(w.o)});
  }
  res.unknown=[...new Set(res.unknown)];return res;
}

function copyText(t){const done=()=>toast('Skopiowano');try{navigator.clipboard.writeText(t).then(done,()=>{const a=$('#panel textarea');if(a){a.select();toast('Zaznacz i skopiuj ręcznie')}})}catch(e){toast('Zaznacz i skopiuj ręcznie')}}
async function saveFile(filename,data,ok,fallback){
  const type=filename.endsWith('.pdf')?'application/pdf':'application/json';
  const blob=new Blob([data],{type});
  try{
    const file=new File([blob],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});ok();return}
  }catch(e){if(e&&e.name==='AbortError'){toast('Anulowano');return}}
  try{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);ok()}catch(e){fallback()}
}

function reportText(){const an=analysis(),m=an.meta,L=[];
  L.push('DZIENNIK TRAWIENNY – PODSUMOWANIE','Okres: '+dShort(m.from)+' – '+dShort(m.to)+' ('+m.days+' dni z wpisami)','Posiłki: '+m.meals+', objawy: '+m.symptoms,'');
  if(!m.enough)L.push('UWAGA: za mało danych na wnioski.','');
  L.push('PODEJRZANE:');an.suspects.forEach(e=>L.push(`- ${e.name} (${e.type==='g'?'grupa':'produkt'}): pewność ${CONF[e.status][0]}; objawy po: ${pct(e.best.p1)} (${fmtN(e.best.a)} z ${fmtN(e.best.n1)}), bez: ${pct(e.best.p0)} (${fmtN(e.best.c)} z ${fmtN(e.best.n0)}); okno ${e.best.w.label}`));
  if(!an.suspects.length)L.push('- brak');
  L.push('','ZA MAŁO DANYCH: '+(an.few.map(e=>e.name+' ('+e.n+'×)').join(', ')||'–'));
  L.push('','To współwystąpienia, nie diagnoza.');return L.join('\n')}

    if(!m.enough){text(`Za mało danych na wnioski: ${m.days} dni z wpisami i ${m.counted} objawów o nasileniu ${m.min}+. Wyniki poniżej są wstępne.`,10,true,[169,107,18]);y+=1}
    text('Jak powstał raport',11,true);
    text(`Samodzielnie prowadzony dziennik posiłków (ze składnikami) i objawów (nasilenie 1–10). Dla każdego produktu i grupy porównano, jak często objaw o nasileniu ${m.min}+ pojawiał się w oknie czasowym po spożyciu, z częstością w porównywalnych okresach bez tego produktu. Sprawdzono okna 30 min–6 h, 6–24 h i 24–72 h; podano okno z najwyraźniejszą różnicą. Posiłki jedzone poza domem (${pct(m.outShare)} wpisów) liczono jako pół obserwacji. Pewność: niska (5+ obserwacji, różnica ≥ 15 pkt proc., p < 0,10), średnia (10+ obserwacji, różnica ≥ 15 pkt proc., p < 0,05), wysoka (20+ obserwacji, różnica ≥ 20 pkt proc., p < 0,01; dokładny test Fishera, jednostronny). Wyniki to współwystąpienia, bez korekty na wielokrotne porównania; nie dowodzą przyczyny.`,8.5,false,[94,109,105]);
    y+=3;text('Podejrzane produkty i grupy',12,true);
    if(an.suspects.length)table(['Pozycja','Pewność','Objaw po spożyciu','Bez produktu','Okno','Najczęstszy objaw'],an.suspects.map(e=>[e.name+(e.type==='g'?' (grupa)':''),CONF[e.status][0],`${pct(e.best.p1)} (${fmtN(e.best.a)} z ${fmtN(e.best.n1)})`,`${pct(e.best.p0)} (${fmtN(e.best.c)} z ${fmtN(e.best.n0)})`,e.best.w.label,e.top?SYM[e.top].toLowerCase():'–']),{0:{fontStyle:'bold',cellWidth:42}});
    else text('Żadna pozycja nie wyróżnia się na tle pozostałych.',9.5);
    if(an.few.length){text('Za mało obserwacji (poniżej 5), bez oceny',11,true);text(an.few.map(e=>`${e.name} (${e.n}×)`).join(', '),8.5,false,[94,109,105]);y+=3}
    if(an.nocontrol.length){text('Jedzone zbyt często, żeby porównać',11,true);text(an.nocontrol.map(e=>`${e.name} (${e.n}×)`).join(', '),8.5,false,[94,109,105]);y+=3}
    if(an.absent.length){text('Grupy wykluczone lub prawie niejedzone (brak danych)',11,true);text(an.absent.map(e=>e.name+((S.settings.excluded||[]).includes(e.key)?' – wykluczone':'')).join(', '),8.5,false,[94,109,105]);y+=3}
    if(an.clear.length){text('Bez wyraźnego związku',11,true);text(an.clear.slice(0,40).map(e=>`${e.name} (${e.n}×)`).join(', '),8.5,false,[94,109,105]);y+=3}
    if(an.bySym.length){text('Objawy w okresie',12,true);table(['Objaw','Liczba','Średnie nasilenie'],an.bySym.map(s=>[s.name,String(s.n),s.avg.toFixed(1).replace('.',',')]))}
    text('Czynniki dodatkowe (dni z objawami)',12,true);
    table(['Czynnik','Dni z czynnikiem','Pozostałe dni','Pewność'],an.factors.map(f=>[f.name,f.n1?`${pct(f.p1)} (${f.a} z ${f.n1})`:'–',f.n0?`${pct(f.p0)} (${f.c} z ${f.n0})`:'–',f.conf==='few'?'za mało danych':CONF[f.conf]?CONF[f.conf][0]:'bez związku']));
    const done=S.tests.filter(t=>testInfo(t).done);
    if(done.length){text('Przeprowadzone testy',12,true);table(['Test','Okres','Dni z objawami w teście','Przed testem'],done.map(t=>{const i=testInfo(t);return [(t.kind==='elim'?'Eliminacja: ':'Ponowne wprowadzenie: ')+t.label,dShort(t.start)+' – '+dShort(i.end-DAY),`${i.during.symDays} z ${i.during.days}`,`${i.before.symDays} z ${i.before.days}`]}))}
    text('Raport z aplikacji do samoobserwacji. Nie jest diagnozą ani zaleceniem dietetycznym.',8,false,[94,109,105]);
    buf=doc.output('arraybuffer');
  }catch(e){console.error(e);fallback();return}
  saveFile('raport-trawienny-'+dayKey(Date.now())+'.pdf',buf,()=>toast('Raport zapisany'),fallback);
}

/* ---------- zdarzenia ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(fn){if(el.tagName==='BUTTON'||el.tagName==='LI'||el.classList.contains('scrim'))e.preventDefault();fn(el)}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){$('#results').innerHTML=resultsHtml(t.value)}
  else if(t.id==='sev'){UI.d.sev=Number(t.value);$('#sevOut').textContent=t.value}
  else if(t.id==='mname'){UI.d.name=t.value}
  else if(t.id==='say'){UI.say=t.value}});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset&&t.dataset.chg;if(!c)return;
  if(c==='time'&&t.value){const [h,m]=t.value.split(':').map(Number);const base=UI.d.id?startOfDay(UI.d.t):keyToDate(UI.day).getTime();const d=new Date(base);d.setHours(h,m,0,0);UI.d.t=d.getTime();UI.d.off=-1;document.querySelectorAll('#panel [data-act=tOff]').forEach(b=>b.classList.remove('on'))}
  else if(c==='out')UI.d.out=t.checked;
  else if(c==='fav')UI.d.fav=t.checked;
  else if(c==='sevMin'){S.settings.sevMin=Number(t.value);save();toast('Zmieniono próg analizy')}});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f);e.target.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='say'){e.preventDefault();e.target.blur();A.parseSay();return}if(e.key==='Escape'&&$('#sheet').classList.contains('open'))closeSheet()});
function route(){const h=(location.hash||'#dzis').slice(1);UI.tab=['dzis','raport','testy','wiecej'].includes(h)?h:'dzis';render();$('#view').scrollTop=0}
window.addEventListener('hashchange',route);
route();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
